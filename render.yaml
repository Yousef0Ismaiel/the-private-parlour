services:
  - type: web
    name: the-private-parlour
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: parlour-members
          property: connectionString
      - key: PARLOUR_KEY_B64
        generateValue: true
      - key: PARLOUR_YOUSEF_INVITE_HASH
        sync: false
      - key: PARLOUR_FRIEND_INVITE_HASH
        sync: false

databases:
  - name: parlour-members
    plan: free
    region: frankfurt
    ipAllowList: []
